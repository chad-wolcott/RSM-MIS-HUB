name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # ── Build & Deploy ───────────────────────────────────────────────────────────
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_ENTRA_CLIENT_ID:   ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID:   ${{ secrets.VITE_ENTRA_TENANT_ID }}
          VITE_REDIRECT_URI:      ${{ secrets.VITE_REDIRECT_URI }}
          VITE_GROUP_ADMIN:       ${{ secrets.VITE_GROUP_ADMIN }}
          VITE_GROUP_ONBOARDING:  ${{ secrets.VITE_GROUP_ONBOARDING }}
          VITE_GROUP_ANALYST:     ${{ secrets.VITE_GROUP_ANALYST }}
          VITE_GROUP_AUDITOR:     ${{ secrets.VITE_GROUP_AUDITOR }}
          VITE_API_BASE:          '/api'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          upload
          app_location:                    '/'
          api_location:                    'api'
          output_location:                 'dist'
          skip_app_build:                  true   # we built above with env vars injected

  # ── Close PR environment ──────────────────────────────────────────────────────
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Environment
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action:                          close
